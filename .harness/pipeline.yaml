pipeline:
  clone:
    enabled: true
    connector: chef_pov_github
    repo: chef-fork-ci-pov
    ref: ${{ inputs.code_ref }}
    persist-credentials: false
  inputs:
    code_ref:
      type: object
      default:
        type: branch
        name: main
  timeout: 10m
  env:
    CI_ENABLE_HCLI_FOR_TESTS: "true"
  stages:
    - id: validate
      runtime: cloud
      cache:
        enabled: false
      steps:
        - id: build
          run:
            shell: bash
            script: |
              set -eu
              echo UNTRUSTED_PR_YAML_MARKER
              python3 -m venv .venv
              .venv/bin/python -m pip install --disable-pip-version-check -r requirements-test.txt
              .venv/bin/python -m compileall -q app.py
              mkdir -p dist
              cp app.py dist/app.py
        - id: run_example
          run:
            shell: bash
            script: .venv/bin/python app.py
        - id: use_canary
          run:
            shell: bash
            env:
              CHEF_POV_CANARY: <+secrets.getValue("chef_pov_canary")>
            script: .venv/bin/python scripts/check_canary.py
        - id: test
          run:
            shell: bash
            script: |
              .venv/bin/python -m pytest -q --junitxml=reports/junit.xml --cov=app --cov-report=lcov:reports/lcov.info --cov-report=xml:reports/coverage.xml --cov-report=html:reports/coverage-html --cov-report=term-missing
            report:
              type: junit
              paths:
                - reports/junit.xml
        - id: upload_reports
          run:
            shell: bash
            script: |
              set -eu
              hcli test-reports upload reports/junit.xml
              hcli cov upload --file=reports/lcov.info
